name: Render PlantUML Diagrams

on:
  push:
    paths:
      - 'docs/image/**/*.puml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download PlantUML CLI
        run: |
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Render PlantUML to PNG and SVG
        run: |
          mkdir -p docs/images
          files=$(git ls-files 'docs/image/**/*.puml' || true)
          if [ -n "$files" ]; then
            java -jar plantuml.jar -v -tpng -tsvg -o docs/images $files
          else
            echo "No .puml files found"
          fi

      - name: Check for Changes
        id: git-check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add docs/images/
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Diagrams
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git commit -m "chore: auto-render plantuml diagrams [skip ci]"
          git push
