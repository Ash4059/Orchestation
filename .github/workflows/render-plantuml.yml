name: Render PlantUML Diagrams

on:
  push:
    paths:
      - 'docs/image/**/*.puml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download PlantUML CLI
        run: |
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Render PlantUML to PNG and SVG (next to .puml files)
        run: |
          files=$(git ls-files 'docs/image/**/*.puml' || true)
          if [ -z "$files" ]; then
            echo "No .puml files found"
            exit 0
          fi

          # For each .puml file, render PNG and SVG into the same directory as the source
          for f in $files; do
            dir=$(dirname "$f")
            mkdir -p "$dir"
            echo "Rendering $f -> $dir"
            java -jar plantuml.jar -tpng -tsvg -o "$dir" "$f"
          done

      - name: Check for Changes
        id: git-check
        run: |
          git config user.name "github-actions[bot]"
          # Use the official GitHub Actions noreply email for the bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add any generated images next to the .puml files (png/svg)
          git add docs/image/**/*.png docs/image/**/*.svg || true
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Diagrams
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git commit -m "chore: auto-render plantuml diagrams [skip ci]"
          git push
